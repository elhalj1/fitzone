name: Development Workflow

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint:
    name: Lint & Type Check
    type: custom
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

  test:
    name: Run Tests
    type: custom
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build_android_preview:
    name: Build Android Preview
    type: build
    needs: [lint, test]
    params:
      platform: android
      profile: preview

  build_ios_preview:
    name: Build iOS Preview
    type: build
    needs: [lint, test]
    params:
      platform: ios
      profile: preview

  deploy_preview:
    name: Deploy to Preview Channel
    type: update
    needs: [build_android_preview, build_ios_preview]
    params:
      channel: preview
